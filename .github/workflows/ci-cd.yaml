name: CI-CD Pipeline

on:
  push:
    branches:
      - dev
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: cozyruiz/intranet-nextjs

jobs:

  # =========================
  # CI - Build & Push Image
  # =========================
  build:
    runs-on: self-hosted

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Eliminar metadatos de macOS
        run: |
          find "$GITHUB_WORKSPACE" -type f -name '._*' -delete
          find "$GITHUB_WORKSPACE" -type f -name '.DS_Store' -delete

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT
        #run: printf 'tag=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image
        run: |
          docker build -t $IMAGE_NAME:${{ steps.meta.outputs.tag }} .

      - name: Push Image
        run: |
          docker push $IMAGE_NAME:${{ steps.meta.outputs.tag }}

  # =========================
  # CD - Deploy to DEV
  # =========================
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    needs: build
    runs-on: self-hosted
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Verificar Helm
        run: helm version

      - name: Configurar acceso a Kubernetes
        run: |
          export KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}"
          if [[ ! -f "$KUBECONFIG" ]]; then
            echo "No se encontró el kubeconfig en $KUBECONFIG"
            exit 1
          fi
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          kubectl config current-context
          kubectl cluster-info

      - name: Ensure ingress-nginx is installed
        run: |
          if ! kubectl get deployment ingress-nginx-controller -n ingress-nginx >/dev/null 2>&1; then
            kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml
          fi
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=120s
          kubectl get pods,svc,ingress -A

      - name: Verify ServiceMonitor support
        run: |
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
          helm repo update
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --set grafana.enabled=true \
            --set grafana.ingress.enabled=true \
            --set grafana.ingress.ingressClassName=nginx \
            --set grafana.ingress.hosts[0]=grafana.local \
            --set prometheus.ingress.enabled=true \
            --set prometheus.ingress.ingressClassName=nginx \
            --set prometheus.ingress.hosts[0]=prometheus.local \
            --set alertmanager.enabled=false \
            --set nodeExporter.enabled=false \
            --set kubeStateMetrics.enabled=false \
            --wait \
            --timeout 5m
          kubectl wait --for=condition=Established \
            crd/servicemonitors.monitoring.coreos.com \
            --timeout=120s

      - name: Create runtime Secret (DEV)
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_PASS: ${{ secrets.ORACLE_PASS }}
          ORACLE_SERVICE_NAME: ${{ secrets.ORACLE_SERVICE_NAME }}
          ORACLE_MODE: ${{ secrets.ORACLE_MODE }}
          ORACLE_CLIENT_LIB_DIR: ${{ secrets.ORACLE_CLIENT_LIB_DIR }}
        run: |
          required=(JWT_SECRET DB_HOST DB_PORT DB_USER DB_PASS ORACLE_HOST ORACLE_PORT ORACLE_USER ORACLE_PASS ORACLE_SERVICE_NAME ORACLE_MODE ORACLE_CLIENT_LIB_DIR)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Falta el secreto de GitHub Environment: $name"
              exit 1
            fi
          done
          kubectl create secret generic intranet-nextjs-dev-env \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=DB_HOST="$DB_HOST" \
            --from-literal=DB_PORT="$DB_PORT" \
            --from-literal=DB_USER="$DB_USER" \
            --from-literal=DB_PASS="$DB_PASS" \
            --from-literal=DB_NAME="$DB_NAME" \
            --from-literal=ORACLE_HOST="$ORACLE_HOST" \
            --from-literal=ORACLE_PORT="$ORACLE_PORT" \
            --from-literal=ORACLE_USER="$ORACLE_USER" \
            --from-literal=ORACLE_PASS="$ORACLE_PASS" \
            --from-literal=ORACLE_SERVICE_NAME="$ORACLE_SERVICE_NAME" \
            --from-literal=ORACLE_MODE="$ORACLE_MODE" \
            --from-literal=ORACLE_CLIENT_LIB_DIR="$ORACLE_CLIENT_LIB_DIR" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm (DEV)
        run: |
          helm upgrade --install intranet-nextjs-dev ./helm/intranet-nextjs \
            -f helm/intranet-nextjs/values-dev.yaml \
            --set image.tag=${{ needs.build.outputs.image_tag }}
          kubectl wait --namespace monitoring \
            --for=create \
            servicemonitor/intranet-nextjs-dev-monitor \
            --timeout=30s

  # =========================
  # CD - Deploy to PROD
  # =========================
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: self-hosted
    environment: production   # 🔥 aquí vive el approval gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Verificar Helm
        run: helm version

      - name: Configurar acceso a Kubernetes
        run: |
          export KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}"
          if [[ ! -f "$KUBECONFIG" ]]; then
            echo "No se encontró el kubeconfig en $KUBECONFIG"
            exit 1
          fi
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          kubectl config current-context
          kubectl cluster-info

      - name: Ensure ingress-nginx is installed
        run: |
          if ! kubectl get deployment ingress-nginx-controller -n ingress-nginx >/dev/null 2>&1; then
            kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml
          fi
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=120s
          kubectl get pods,svc,ingress -A

      - name: Verify ServiceMonitor support
        run: |
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
          helm repo update
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --set grafana.enabled=true \
            --set grafana.ingress.enabled=true \
            --set grafana.ingress.ingressClassName=nginx \
            --set grafana.ingress.hosts[0]=grafana.local \
            --set prometheus.ingress.enabled=true \
            --set prometheus.ingress.ingressClassName=nginx \
            --set prometheus.ingress.hosts[0]=prometheus.local \
            --set alertmanager.enabled=false \
            --set nodeExporter.enabled=false \
            --set kubeStateMetrics.enabled=false \
            --wait \
            --timeout 5m
          kubectl wait --for=condition=Established \
            crd/servicemonitors.monitoring.coreos.com \
            --timeout=120s

      - name: Create runtime Secret (PROD)
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_PASS: ${{ secrets.ORACLE_PASS }}
          ORACLE_SERVICE_NAME: ${{ secrets.ORACLE_SERVICE_NAME }}
          ORACLE_MODE: ${{ secrets.ORACLE_MODE }}
          ORACLE_CLIENT_LIB_DIR: ${{ secrets.ORACLE_CLIENT_LIB_DIR }}
        run: |
          required=(JWT_SECRET DB_HOST DB_PORT DB_USER DB_PASS ORACLE_HOST ORACLE_PORT ORACLE_USER ORACLE_PASS ORACLE_SERVICE_NAME ORACLE_MODE ORACLE_CLIENT_LIB_DIR)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Falta el secreto de GitHub Environment: $name"
              exit 1
            fi
          done
          kubectl create secret generic intranet-nextjs-prod-env \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=DB_HOST="$DB_HOST" \
            --from-literal=DB_PORT="$DB_PORT" \
            --from-literal=DB_USER="$DB_USER" \
            --from-literal=DB_PASS="$DB_PASS" \
            --from-literal=DB_NAME="$DB_NAME" \
            --from-literal=ORACLE_HOST="$ORACLE_HOST" \
            --from-literal=ORACLE_PORT="$ORACLE_PORT" \
            --from-literal=ORACLE_USER="$ORACLE_USER" \
            --from-literal=ORACLE_PASS="$ORACLE_PASS" \
            --from-literal=ORACLE_SERVICE_NAME="$ORACLE_SERVICE_NAME" \
            --from-literal=ORACLE_MODE="$ORACLE_MODE" \
            --from-literal=ORACLE_CLIENT_LIB_DIR="$ORACLE_CLIENT_LIB_DIR" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm (PROD)
        run: |
          helm upgrade --install intranet-nextjs-prod ./helm/intranet-nextjs \
            -f helm/intranet-nextjs/values-prod.yaml \
            --set image.tag=${{ needs.build.outputs.image_tag }}
          kubectl wait --namespace monitoring \
            --for=create \
            servicemonitor/intranet-nextjs-prod-monitor \
            --timeout=30s