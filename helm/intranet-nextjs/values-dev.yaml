replicaCount: 1

image:
  repository: cozyruiz/intranet-nextjs
  tag: "latest"
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Configuración para soportar WebSockets (HMR) en Next.js development
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  tls:
    - secretName: escalante-wildcard-tls
      hosts:
        - intranet-nextjs-dev.escalante.com.mx
  hosts:
    - host: intranet-nextjs-dev.escalante.com.mx
      paths:
        - path: /
          pathType: Prefix

env:
  NODE_ENV: development
  ENVIRONMENT: "DEV"
  NEXT_PUBLIC_ENVIRONMENT: "DEV"

envSecretName: intranet-nextjs-dev-env

monitoring:
  enabled: true
