replicaCount: 1

image:
  repository: cozyruiz/intranet-nextjs
  tag: "latest"
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  tls:
    - secretName: escalante-wildcard-tls
      hosts:
        - intranet-nextjs-prod.escalante.com.mx
  hosts:
    - host: intranet-nextjs-prod.escalante.com.mx
      paths:
        - path: /
          pathType: Prefix

env:
  NODE_ENV: production
  ENVIRONMENT: "PROD"
  NEXT_PUBLIC_ENVIRONMENT: "PROD"

envSecretName: intranet-nextjs-prod-env

monitoring:
  enabled: true
